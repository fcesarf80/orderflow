version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: orderflow_postgres
    environment:
      POSTGRES_DB: orderflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: orderflow_pwd123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Carrega automaticamente o nosso script SQL criado no Exercício 03
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  postgres_data:
